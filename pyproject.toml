[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overscope-cli"
version = "0.1.1"
description = "Catch coding-agent scope creep before you commit — compare Claude Code and Codex sessions with your git diff."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Overscope contributors" }]
keywords = [
  "claude-code",
  "codex",
  "coding-agents",
  "ai-agents",
  "code-review",
  "cli",
  "git",
  "pre-commit",
  "local-first",
  "developer-tools",
  "scope-creep",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]
dependencies = [
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.urls]
Homepage = "https://github.com/sandeepwastaken/overscope"
Repository = "https://github.com/sandeepwastaken/overscope"
Issues = "https://github.com/sandeepwastaken/overscope/issues"

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
overscope = "overscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/overscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["overscope"]
