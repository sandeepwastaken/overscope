[package]
name = "overscope-desktop"
version = "0.1.0"
description = "Local change intelligence for coding-agent sessions"
authors = ["Overscope contributors"]
edition = "2021"

[lib]
name = "overscope_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
